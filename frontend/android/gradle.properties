android.useAndroidX=true

# This newDsl flag was added by the Flutter template
android.newDsl=false

# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# El tope de memoria de Gradle tiene que caber en la maquina.
#
# Venia en -Xmx8G, que es lo que trae la plantilla de Flutter, y aqui la maquina
# tiene 7.9 GB en total: se estaba pidiendo mas RAM de la que existe. El proceso
# no la consigue y la compilacion muere con un error que no menciona la memoria.
#
# A eso se suma que cada compilacion dejaba su daemon en pie. Once daemons de
# Gradle y Kotlin llegaron a occupar 3.4 GB sin que hubiera ninguna compilacion en
# curso, y entonces si faltaba RAM para todo lo demas.
#
# 2 GB para Gradle y 1 GB para el daemon de Kotlin es de sobra para este
# proyecto en un equipo con 16 GB. En este equipo, de 7,9 GB, no: 2 GB de heap
# mas 768 MB de metaspace mas el gasto nativo del propio JVM piden unos 3,5 GB,
# y si hay menos de eso libres el Gradle ni siquiera arranca y falla con
# "Could not create service of type FileLockContentionHandler", que no menciona
# la memoria ni una vez.
#
# 1200 MB es lo que cabe con el resto de programas abiertos. Con
# `kotlin.incremental=false` recompila entero el modulo Kotlin, que en este
# proyecto es solo el de `image_picker_android`, asi que entra de sobra.
#
# Si el proyecto crece y salen fallos de memoria, se sube aqui. No se sube en la
# maquina de cada uno, que es donde estas cosas se olvidan.
org.gradle.jvmargs=-Xmx1200m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=128m -XX:+HeapDumpOnOutOfMemoryError

# Sin esto el daemon de Kotlin arranca con su propio valor por defecto, que se
# suma al de Gradle en vez de repartirse con el. Aqui tampoco puede ser mucho:
# son otros 700 MB que salen del mismo presupuesto.
kotlin.daemon.jvmargs=-Xmx700m

# La compilacion incremental de Kotlin fallaba al compilar image_picker_android
# con "Could not close incremental caches in ...". No es un problema del codigo:
# borrar build/ y reiniciar los daemons no lo arregla, porque el error ocurre al
# cerrar las caches al terminar.
#
# Sin incremental, recompila el modulo Kotlin entero cada vez. El APK tarda algo
# mas, pero compila, y una compilacion que falla siempre no sirve de nada.
kotlin.incremental=false